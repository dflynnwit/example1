name: CI/CD Pipeline

# Agile Practice: Continuous Integration
# This workflow demonstrates automated testing and deployment
# following Agile best practices

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build with Maven
      run: |
        cd sample-project
        mvn clean compile
        
    - name: Run tests
      run: |
        cd sample-project
        mvn test
        
    - name: Generate test coverage report
      run: |
        cd sample-project
        mvn jacoco:report
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: sample-project/target/site/jacoco/
        
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Run linting
      run: |
        echo "Running code quality checks..."
        # In a real project, you would run tools like:
        # - Checkstyle for Java code style
        # - PMD for code analysis
        # - SpotBugs for bug detection
        echo "Code quality checks passed!"
        
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: always()
    
    steps:
    - name: Send notification
      run: |
        echo "Pipeline completed!"
        # In a real project, integrate with:
        # - Slack
        # - Microsoft Teams
        # - Email notifications
